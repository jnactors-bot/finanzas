<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis finanzas</title>
<style>
  :root { --bg1:#0A1F44; --bg2:#10316B; --card:#13306B; --card2:#17407F; --ink:#FFFFFF; --mut:#B8C7E6; --line:#ffffff1f;
          --verde:#00E5A0; --azul:#2D9CFF; --oro:#FFC83D; --rojo:#FF6B6B; --ac:#00E5A0; --amarillo:#FFC83D; --ink-ac:#04281c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:#0A1F44; }
  body { margin:0; color:var(--ink); font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh;
         background:radial-gradient(700px 420px at 90% -5%,#2D9CFF55,transparent 60%),radial-gradient(600px 400px at -10% 20%,#00E5A029,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
         padding-bottom:calc(150px + env(safe-area-inset-bottom)); }
  main { max-width:560px; margin:0 auto; padding:12px 16px 0; }
  h1 { font-size:22px; margin:0; font-weight:800; letter-spacing:-.02em; }
  h2 { margin:0; }
  b { font-weight:700; }
  .sub { color:var(--mut); font-size:13px; margin-top:2px; }
  .mut { color:var(--mut); } .bad,.neg { color:var(--rojo); } .ok { color:var(--verde); }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:2px 0 8px; }
  .ciclo { color:var(--mut); font-size:14px; margin-top:2px; font-weight:600; }
  .icon-btn { background:#ffffff14; border:1px solid var(--line); color:var(--ink); border-radius:14px; width:44px; height:44px; font-size:20px; cursor:pointer; position:relative; display:grid; place-items:center; padding:0; }
  .hdr-btns { display:flex; gap:6px; }

  /* navegación: pestañas arriba en celular, barra lateral en laptop */
  #nav { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:4px 0 0; }
  #nav button { background:#ffffff12; border:1px solid var(--line); color:var(--mut); border-radius:14px; min-height:48px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; padding:4px 2px; font-size:11px; font-weight:700; }
  #nav button .ni { font-size:20px; line-height:1.1; }
  #nav button.on { background:linear-gradient(135deg,#00E5A0,#2D9CFF); color:#04281c; border-color:transparent; }
  #nav .nav-logo, #nav .only-pc { display:none; }

  .card { background:linear-gradient(160deg,var(--card2),var(--card)); border:1px solid #ffffff22; border-radius:24px; padding:16px; margin-top:12px; box-shadow:0 10px 28px #03102b66; animation:entra .5s cubic-bezier(.2,.8,.2,1) both; }
  .card:empty { display:none; }
  .ch { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .ch-e { font-size:30px; line-height:1; }
  .ch h2 { font-size:19px; font-weight:800; flex:1; letter-spacing:-.01em; }
  .ib { width:44px; height:44px; margin:-8px -8px -8px 0; border-radius:50%; border:0; background:transparent; color:var(--mut); font-size:20px; cursor:pointer; }
  .ib:hover { color:#fff; }

  /* HOY */
  .hoy { text-align:center; position:relative; background:linear-gradient(160deg,#17407F,#0F3A6E 60%,#0B5A6A); border-color:#00E5A055; }
  .hoy.amarillo { border-color:#FFC83D88; } .hoy.rojo { border-color:#FF6B6BAA; }
  .hoy-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .est-t { font-weight:800; font-size:17px; padding:6px 12px; border-radius:20px; background:#00E5A026; color:#00E5A0; }
  .hoy.amarillo .est-t { background:#FFC83D26; color:#FFC83D; } .hoy.rojo .est-t { background:#FF6B6B26; color:#FF8E8E; }
  .hoy-ring { position:relative; width:240px; max-width:100%; margin:6px auto 4px; aspect-ratio:1; }
  .hoy-ring svg.ring { width:100%; height:100%; display:block; }
  .ring { transform:rotate(-90deg); }
  .ring .pr { animation:arco 1.2s cubic-bezier(.2,.8,.2,1) both; filter:drop-shadow(0 0 6px #00E5A066); }
  .hoy-mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 28px; }
  .hoy .lab { font-size:14px; color:var(--mut); font-weight:600; }
  .hoy .num { font-size:54px; font-weight:800; letter-spacing:-.03em; line-height:1.05; }
  .hoy .lab2 { font-size:14px; color:#00E5A0; font-weight:700; margin-top:2px; }
  .cara { position:absolute; right:-4px; bottom:-2px; width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-size:40px; background:#0A1F44; border:3px solid #00E5A0; box-shadow:0 4px 14px #0008; animation:pop .6s .3s both; }
  .hoy.amarillo .cara { border-color:#FFC83D; } .hoy.rojo .cara { border-color:#FF6B6B; }
  .mini { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .mini div { background:#ffffff14; border-radius:18px; padding:10px 4px; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .mini .mi { font-size:22px; } .mini b { font-size:17px; font-weight:800; } .mini .ml { color:var(--mut); font-size:12px; font-weight:600; }
  .hoy .btn.p { margin-top:10px; width:100%; }

  /* barras */
  .track { position:relative; height:12px; background:#ffffff1f; border-radius:9px; overflow:hidden; margin:6px 0; }
  .track.gruesa { height:18px; }
  .track .fill { position:absolute; top:0; bottom:0; left:0; background:linear-gradient(90deg,#00E5A0,#2D9CFF); border-radius:9px; animation:crece 1s cubic-bezier(.2,.8,.2,1) both; }
  .track .win { position:absolute; top:0; bottom:0; background:repeating-linear-gradient(45deg,#FFC83D66,#FFC83D66 4px,transparent 4px,transparent 8px); border-left:3px solid #FFC83D; }
  .track .hoy-m { position:absolute; top:0; bottom:0; width:4px; background:#fff; border-radius:2px; }
  .leyenda { display:flex; justify-content:space-between; color:var(--mut); font-size:13px; font-weight:600; }

  /* filas con icono grande */
  .irow { display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); cursor:pointer; min-height:56px; }
  .irow:first-of-type { border-top:0; }
  .bigico { width:52px; height:52px; border-radius:18px; display:grid; place-items:center; font-size:28px; flex:none; background:#ffffff1f; }
  .t { flex:1; min-width:0; }
  .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .top b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:16px; }
  .top .m { font-weight:800; font-size:19px; white-space:nowrap; }
  .t .s { color:var(--mut); font-size:13px; font-weight:600; display:block; }
  .total,.debe { display:flex; justify-content:space-between; align-items:baseline; padding:10px 14px; border-radius:16px; background:#ffffff14; margin-top:6px; color:var(--mut); font-weight:700; }
  .total b,.debe b { color:#fff; font-size:24px; font-weight:800; }
  .debe b.ok { color:var(--verde); } .debe b.neg { color:var(--rojo); }
  .card > .row, .card > button.btn { margin-top:12px; }
  .card > button.btn { width:100%; }

  /* metas */
  .metas-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:4px; }
  .meta { display:flex; flex-direction:column; align-items:center; text-align:center; padding:12px 6px; border-radius:20px; background:#ffffff12; cursor:pointer; gap:2px; min-height:44px; }
  .mring { position:relative; width:96px; height:96px; }
  .mring .ring { width:96px; height:96px; } .mring .ring .pr { filter:drop-shadow(0 0 5px #FFC83D77); }
  .mpct { position:absolute; inset:0; display:grid; place-items:center; font-weight:800; font-size:22px; color:#FFC83D; }
  .mn { font-size:15px; margin-top:6px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ms { font-size:13px; color:var(--mut); font-weight:600; }
  .lograda .spark { position:absolute; top:-6px; right:-4px; font-size:24px; animation:brilla 1.6s ease-in-out infinite; }
  .cf { position:absolute; left:50%; top:50%; width:8px; height:8px; border-radius:2px; pointer-events:none; animation:conf 1.3s ease-out forwards; }

  /* bolsas */
  .tabs { display:flex; gap:6px; margin-bottom:8px; }
  .tabs button { flex:1; min-height:44px; background:#ffffff14; border:1px solid var(--line); border-radius:14px; padding:8px 4px; cursor:pointer; font-size:14px; font-weight:700; color:var(--mut); }
  .tabs button.on { background:linear-gradient(135deg,#00E5A0,#2D9CFF); color:#04281c; border-color:transparent; }
  .bolsas { display:grid; gap:0; }
  .bolsa { display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); cursor:pointer; min-height:56px; }
  .bolsa:first-child { border-top:0; }
  .bolsa .m { font-weight:800; font-size:16px; white-space:nowrap; }
  .bolsa .track { height:14px; margin:6px 0 0; }

  /* donut */
  .donut-box { position:relative; margin:4px auto 12px; max-width:100%; }
  .donut { transform:rotate(-90deg); display:block; max-width:100%; height:auto; }
  .donut circle { animation:aparece .8s both; }
  .donut-mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut-mid span { color:var(--mut); font-size:13px; font-weight:600; } .donut-mid b { font-size:20px; font-weight:800; }
  .cats { display:grid; gap:8px; }
  .cat { display:flex; align-items:center; gap:10px; min-height:44px; }
  .cico { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:22px; flex:none; }
  .cn { flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cp { font-size:18px; font-weight:800; } .cm { color:var(--mut); font-size:13px; min-width:70px; text-align:right; font-weight:600; }

  /* consejos */
  .tip { display:flex; width:100%; align-items:center; gap:12px; text-align:left; min-height:52px; margin-top:8px; padding:8px 14px; border-radius:18px; border:1px solid #ffffff1f; background:#ffffff14; cursor:pointer; font:inherit; color:inherit; }
  .tip:first-of-type { margin-top:0; }
  .tip-e { font-size:28px; } .tip-t { font-weight:600; font-size:15px; line-height:1.25; }
  .vermas { margin-top:8px; width:100%; }

  /* plan */
  .step { display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--line); min-height:48px; }
  .step:first-of-type { border-top:0; }
  .num-c { width:36px; height:36px; border-radius:50%; background:#FFC83D; color:#2b1d00; display:grid; place-items:center; font-weight:800; flex:none; }
  .sn { flex:1; font-weight:600; } .step b { font-size:18px; font-weight:800; }
  .evrow { margin:8px 0; }

  /* movimientos */
  .mov { display:flex; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line); cursor:pointer; min-height:56px; }
  .mov:first-of-type { border-top:0; }
  .ico { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-size:22px; flex:none; background:#ffffff1f; }
  .mov .t b { display:block; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mov .t span { color:var(--mut); font-size:12px; font-weight:600; }
  .mov .m { font-weight:800; white-space:nowrap; font-size:16px; } .mov .m.rech { color:var(--rojo); } .mov .m.ing { color:var(--verde); }

  /* estados vacíos y banner */
  .vacio { text-align:center; padding:18px 8px; color:var(--mut); font-weight:700; font-size:16px; }
  .vacio-e { font-size:54px; line-height:1.1; opacity:.9; animation:flota 3s ease-in-out infinite; }
  .empty-cfg { text-align:center; } .empty-cfg .btn { margin-top:10px; width:100%; }
  .banner { background:linear-gradient(135deg,#00B37D,#2D9CFF); border:0; text-align:center; }
  .banner .ban-t { font-size:20px; font-weight:800; margin-bottom:10px; }
  .banner button { width:100%; background:#fff; color:#04281c; }

  /* estadísticas */
  .stat-score { text-align:center; }
  .hoy-ring.score { width:200px; }
  .score .num { font-size:60px; font-weight:800; }
  .trend { display:inline-flex; align-items:center; gap:8px; border:2px solid; border-radius:30px; padding:4px 16px; margin-top:8px; font-size:17px; }
  .trend .ta { font-size:30px; font-weight:800; line-height:1; }
  .stat-msg { margin-top:10px; color:var(--mut); font-weight:600; }
  .chart { width:100%; height:auto; display:block; }
  .chart .ax { fill:#B8C7E6; font-size:12px; font-weight:700; }
  .chart .bgrow { transform-box:fill-box; transform-origin:bottom; animation:sube .8s cubic-bezier(.2,.8,.2,1) both; }
  .chart .line { stroke-dasharray:600; animation:trazo 1.4s ease-out both; }
  .legend { display:flex; gap:14px; justify-content:center; margin-top:8px; }
  .lg { padding:4px 12px; border-radius:20px; font-weight:700; font-size:14px; } .lg.b { background:#2D9CFF33; color:#8CC8FF; } .lg.c { background:#FF6B6B33; color:#FF9B9B; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chp { border:2px solid; border-radius:20px; padding:5px 12px; font-weight:700; }

  /* chips de estado, badge */
  .chip { display:inline-block; padding:2px 9px; border-radius:20px; background:#ffffff1f; font-size:12px; }
  .chip.est-Aprobado { background:#00E5A033; color:var(--verde); } .chip.est-Pendiente { background:#FFC83D33; color:var(--oro); } .chip.est-Bloqueado { background:#FF6B6B33; color:var(--rojo); }
  .badge { position:absolute; top:-6px; right:-6px; background:var(--rojo); color:#fff; border-radius:20px; font-size:11px; font-weight:800; padding:1px 6px; min-width:18px; }

  /* formularios, botones, ventanas */
  input,select,button { font:inherit; color:inherit; }
  input,select { background:#ffffff14; border:1px solid #ffffff33; border-radius:14px; padding:13px; width:100%; min-width:0; min-height:48px; }
  input::placeholder { color:#B8C7E6aa; }
  input:focus,select:focus,button:focus-visible { outline:3px solid #2D9CFF; outline-offset:1px; }
  select option { background:#13306B; color:#fff; }
  button.p { background:linear-gradient(135deg,#00E5A0,#00C48C); color:var(--ink-ac); border:0; border-radius:16px; padding:0 18px; font-weight:800; cursor:pointer; white-space:nowrap; min-height:48px; box-shadow:0 6px 16px #00E5A044; }
  button.s { background:#ffffff1a; border:1px solid #ffffff2e; border-radius:16px; padding:12px 14px; cursor:pointer; font-weight:700; min-height:48px; }
  button.btn { padding:13px 16px; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.5; }
  .sheet { position:fixed; inset:0; background:#020c22cc; z-index:20; display:flex; align-items:flex-end; backdrop-filter:blur(3px); }
  .sheet > div { background:linear-gradient(170deg,#17407F,#13306B); width:100%; max-width:560px; margin:0 auto; border-radius:28px 28px 0 0; padding:20px 16px calc(18px + env(safe-area-inset-bottom)); max-height:92vh; overflow:auto; border-top:1px solid #ffffff33; animation:sube2 .3s ease both; }
  .sheet > div > b:first-child, #formBox > b { font-size:20px; font-weight:800; display:block; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
  .grid button { background:#ffffff14; border:1px solid #ffffff2e; border-radius:14px; padding:11px 4px; cursor:pointer; font-size:14px; min-height:48px; font-weight:600; }
  label { display:block; color:var(--mut); font-size:13px; margin:12px 0 4px; font-weight:600; }
  .row { display:flex; gap:8px; margin-top:12px; } .row > * { flex:1; }
  .msg { font-size:14px; font-weight:700; }
  #msg:empty { display:none; }
  #msg { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom)); z-index:8; background:#0A1F44f2; border:1px solid #ffffff33; border-radius:24px; padding:10px 18px; box-shadow:0 8px 24px #0009; max-width:90vw; animation:pop .3s both; }
  .menu { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .item { display:flex; gap:10px; align-items:center; padding:11px 0; border-top:1px solid var(--line); cursor:pointer; min-height:48px; }
  .item:first-of-type { border-top:0; }
  .item .t b { display:block; } .item .t span { color:var(--mut); font-size:12px; }
  .d-line { display:flex; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .d-line .c { flex:1; min-width:0; } .d-line select { width:auto; padding:7px; font-size:13px; }
  .paso { color:var(--oro); font-size:13px; letter-spacing:.06em; text-transform:uppercase; font-weight:800; }
  .consejo { padding:12px; background:#ffffff14; border-radius:14px; margin-top:8px; font-size:15px; }
  .urow { padding:12px 0; border-top:1px solid var(--line); } .urow:first-of-type { border-top:0; }
  .urow .bt { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; } .urow .bt button { padding:7px 11px; font-size:13px; }
  #infoTxt p { margin:10px 0; font-size:16px; line-height:1.45; }
  #login,#registro,#espera { margin-top:8vh; } #espera { text-align:center; }
  [hidden] { display:none !important; }

  /* barra inferior */
  .bar { position:fixed; left:0; right:0; bottom:0; background:#0A1F44ee; backdrop-filter:blur(10px); padding:8px 12px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid #ffffff22; z-index:6; }
  .bar-in { max-width:560px; margin:0 auto; }
  .bar form { display:flex; gap:8px; }
  .bar form input { min-height:44px; padding:8px 14px; border-radius:22px; }
  .bar form button { width:48px; min-height:44px; padding:0; border-radius:22px; font-size:20px; }
  .acts { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:8px; }
  .acts button { min-height:52px; border-radius:16px; border:1px solid #ffffff2e; background:#ffffff14; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--mut); padding:2px; }
  .acts button span { font-size:24px; line-height:1.1; }
  .acts button.g { background:linear-gradient(135deg,#00E5A0,#00C48C); color:#04281c; border:0; }
  .acts button.i { background:#2D9CFF33; } .acts button.m { background:#FFC83D2e; }

  /* vistas (celular): qué se ve en cada una */
  #app .vw { display:none; }
  #app[data-v="inicio"] .v-inicio, #app[data-v="presu"] .v-presu, #app[data-v="ingdeu"] .v-ingdeu, #app[data-v="metas"] .v-metas, #app[data-v="stats"] .v-stats { display:block; }
  #app[data-v="inicio"] #consejos.v-inicio:empty { display:none; }
  .vw:empty { display:none !important; }
  .foot { text-align:center; margin:18px 0; color:var(--mut); font-size:13px; }

  @keyframes entra { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes crece { from { width:0 !important; } }
  @keyframes arco { from { stroke-dasharray:0 100; } }
  @keyframes pop { from { opacity:0; transform:scale(.6); } to { opacity:1; transform:none; } }
  #msg { animation-name:pop2; } @keyframes pop2 { from { opacity:0; transform:translate(-50%,10px); } to { opacity:1; transform:translate(-50%,0); } }
  @keyframes aparece { from { opacity:0; } to { opacity:1; } }
  @keyframes sube { from { transform:scaleY(0); } to { transform:scaleY(1); } }
  @keyframes sube2 { from { transform:translateY(40px); opacity:.4; } to { transform:none; opacity:1; } }
  @keyframes trazo { from { stroke-dashoffset:600; } to { stroke-dashoffset:0; } }
  @keyframes flota { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @keyframes brilla { 0%,100% { transform:scale(1) rotate(0); opacity:1; } 50% { transform:scale(1.35) rotate(15deg); opacity:.7; } }
  @keyframes conf { from { transform:translate(0,0) rotate(0); opacity:1; } to { transform:translate(var(--dx),var(--dy)) rotate(540deg); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }

  /* ===== LAPTOP / PANEL (>= 900px) ===== */
  @media (min-width:900px) {
    body { padding:76px 0 24px 232px; }
    main { max-width:1280px; padding:20px 32px 0; }
    #nav { position:fixed; left:0; top:0; bottom:0; width:232px; display:flex; flex-direction:column; gap:6px; margin:0; padding:20px 14px; background:#071836d9; border-right:1px solid #ffffff1f; z-index:7; backdrop-filter:blur(10px); }
    #nav .nav-logo { display:block; font-size:22px; font-weight:800; padding:6px 10px 18px; letter-spacing:-.02em; }
    #nav button { flex-direction:row; justify-content:flex-start; gap:14px; min-height:52px; padding:0 14px; font-size:16px; border-radius:16px; background:transparent; border-color:transparent; }
    #nav button .ni { font-size:26px; width:32px; text-align:center; }
    #nav button:hover { background:#ffffff14; }
    #nav button.on { background:linear-gradient(135deg,#00E5A0,#2D9CFF); }
    #nav .only-pc { display:flex; margin-top:auto; }
    .bar { left:232px; bottom:auto; top:0; border-top:0; border-bottom:1px solid #ffffff22; padding:12px 32px; }
    .bar-in { max-width:1216px; display:flex; gap:12px; align-items:center; }
    .bar form { flex:1; } .bar form input { min-height:48px; }
    .acts { display:flex; margin:0; gap:8px; }
    .acts button { flex-direction:row; gap:8px; padding:0 16px; font-size:15px; min-height:48px; color:#fff; }
    .acts button span { font-size:22px; }
    .acts .pc-hide { display:none; }
    #msg { bottom:24px; }
    #app { display:grid; grid-template-columns:repeat(6,1fr); gap:20px; align-items:start; }
    #app > header, #app > #msg-wrap { grid-column:1/-1; }
    #app .vw { margin-top:0; }
    #app[data-v="inicio"] .v-inicio, #app[data-v="presu"] .v-presu, #app[data-v="ingdeu"] .v-ingdeu, #app[data-v="metas"] .v-metas, #app[data-v="stats"] .v-stats { display:block; }
    #app .card { margin-top:0; padding:22px; border-radius:28px; }
    #app .vw { grid-column:span 2; }
    #app .vw.w2 { grid-column:span 3; } #app .vw.w3 { grid-column:span 4; } #app .vw.wall { grid-column:1/-1; }
    .hoy-ring { width:300px; } .hoy .num { font-size:68px; } .cara { width:78px; height:78px; font-size:50px; }
    .score { width:260px !important; }
    #app #hoy { grid-row:span 2; } #app #linea, #app #consejos { grid-column:span 3; }
    .mini b { font-size:20px; }
    .metas-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
    .mring,.mring .ring { width:120px; height:120px; } .mpct { font-size:26px; }
    .bolsas { grid-template-columns:repeat(2,1fr); column-gap:24px; }
    .bolsa:nth-child(2) { border-top:0; }
    .foot { grid-column:1/-1; }
    #app[data-v="stats"] #stats { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
  }
  @media (min-width:1200px) {
    #app .vw { grid-column:span 2; }
    #app .vw.w2 { grid-column:span 3; }
  }
</style>
</head>
<body>
<main>
  <section id="login" class="card" hidden>
    <h1 style="margin-bottom:6px">💸 Mis finanzas</h1>
    <div class="sub">🔒 Entra con tu cuenta de Google.</div>
    <div id="gbtn" style="margin:18px 0 6px;display:flex;justify-content:center;min-height:44px"></div>
    <div id="loginMsg" class="msg bad"></div>
    <div class="row"><button class="s btn" id="loginReintentar" hidden>Reintentar</button></div>
  </section>

  <section id="registro" class="card" hidden>
    <div class="ch"><span class="ch-e">📝</span><h2>Crea tu cuenta</h2></div>
    <label for="regEmail">Tu correo</label>
    <input id="regEmail" type="email" readonly>
    <label for="regNombre">Nombre</label>
    <input id="regNombre" type="text" autocomplete="name">
    <label for="regCel">Celular</label>
    <input id="regCel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej.: 987654321">
    <label for="regEdad">Edad</label>
    <input id="regEdad" type="number" inputmode="numeric" min="14" max="100">
    <label style="display:flex;gap:8px;align-items:flex-start;margin:14px 0 0"><input type="checkbox" id="regAcepto" style="width:24px;min-height:24px;margin-top:2px;flex:none"> <span>Entiendo que mis datos se guardan en un Sheet privado creado para mí; el administrador de la app podría acceder técnicamente a él.</span></label>
    <div id="regMsg" class="msg bad"></div>
    <div class="row"><button class="p btn" id="regEnviar">Enviar solicitud</button><button class="s btn" id="regSalir">Salir</button></div>
  </section>

  <section id="espera" class="card" hidden>
    <div style="font-size:54px" id="esperaIco">⏳</div>
    <h1 id="esperaTit" style="margin:6px 0">Tu cuenta está en revisión</h1>
    <div class="sub" id="esperaTxt">Te avisaremos cuando esté lista. Vuelve a revisar en un rato.</div>
    <div id="esperaMsg" class="msg bad"></div>
    <div class="row"><button class="p btn" id="esperaRevisar">Revisar de nuevo</button><button class="s btn" id="esperaSalir">Salir</button></div>
  </section>

  <section id="app" data-v="inicio" hidden>
    <header>
      <div><h1>💸 Mis finanzas</h1><div class="ciclo" id="ciclo">Cargando…</div></div>
      <div class="hdr-btns">
        <button class="icon-btn" id="btnUsers" title="Usuarios" aria-label="Usuarios" hidden>👥<span id="badge" class="badge" hidden></span></button>
        <button class="icon-btn" id="btnScan" title="Revisar correos" aria-label="Revisar correos">🔄</button>
        <button class="icon-btn" id="btnBoleta" title="Subir boleta" aria-label="Subir boleta">📄</button>
      </div>
    </header>
    <nav id="nav" aria-label="Secciones" hidden>
      <div class="nav-logo">💸 Mis finanzas</div>
      <button data-v="inicio"><span class="ni">🏠</span><span>Inicio</span></button>
      <button data-v="presu"><span class="ni">🧮</span><span>Bolsas</span></button>
      <button data-v="ingdeu"><span class="ni">💰</span><span>Dinero</span></button>
      <button data-v="metas"><span class="ni">🎯</span><span>Metas</span></button>
      <button data-v="stats"><span class="ni">📈</span><span>Stats</span></button>
      <button id="navCfg" class="only-pc"><span class="ni">⚙️</span><span>Ajustes</span></button>
    </nav>
        <div id="banner" class="vw v-inicio wall"></div>
    <div id="estado" class="vw v-inicio"></div>
    <div id="hoy" class="vw v-inicio w2"></div>
    <div id="linea" class="vw v-inicio"></div>
    <div id="consejos" class="vw v-inicio"></div>
    <div id="donut" class="vw v-inicio"></div>
    <div class="vw v-inicio w3"><div class="card"><div class="ch"><span class="ch-e">🧾</span><h2>Movimientos</h2></div><div id="movs"></div></div></div>
    <div id="presu" class="vw v-presu w2"></div>
    <div id="fin_mes" class="vw v-presu"></div>
    <div id="ing" class="vw v-ingdeu"></div>
    <div id="fin_plan" class="vw v-ingdeu"></div>
    <div id="fin_deu" class="vw v-ingdeu"></div>
    <div id="fin_ev" class="vw v-ingdeu"></div>
    <div id="metas" class="vw v-metas w2"></div>
    <div id="stats" class="vw v-stats wall"></div>
    <p class="foot"><span id="quien"></span> · <a href="#" id="salir" style="color:inherit">Salir</a></p>
  </section>
</main>
<div id="msg" class="msg" role="status"></div>

<div class="bar" id="barra" hidden>
  <div class="bar-in">
    <form id="formAdd">
      <input id="texto" placeholder="Ej.: almuerzo 18" aria-label="Anotar gasto" autocomplete="off" enterkeyhint="send">
      <button class="p" id="btnAdd" aria-label="Agregar">➤</button>
    </form>
    <div class="acts">
      <button class="g" id="btnGasto" type="button"><span>➕</span>Gasto</button>
      <button class="i" id="btnIng" type="button"><span>💰</span>Ingreso</button>
      <button class="m pc-hide" id="btnMetas" type="button"><span>🎯</span>Metas</button>
      <button class="pc-hide" id="btnStats" type="button"><span>📈</span>Stats</button>
      <button class="pc-hide" id="btnCfg" type="button"><span>⚙️</span>Ajustes</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheetMov" hidden><div>
  <b id="smTitulo"></b><div class="sub" id="smInfo"></div>
  <div class="grid" id="smCats"></div>
  <label style="display:flex;gap:8px;align-items:center;margin:0 0 12px"><input type="checkbox" id="smAprender" style="width:24px;min-height:24px;flex:none"> Recordar para este comercio</label>
  <div class="row"><button class="s" id="smBorrar">🗑 Borrar</button><button class="s" id="smCerrar">Cerrar</button></div>
</div></div>

<div class="sheet" id="sheetForm" hidden><div id="formBox"></div></div>

<div class="sheet" id="sheetInfo" hidden><div>
  <b id="infoTit"></b>
  <div id="infoTxt"></div>
  <div class="row"><button class="p btn" id="infoCerrar">Entendido</button></div>
</div></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
