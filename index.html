<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis finanzas</title>
<style>
  :root { --bg:#0b0f14; --card:#141a22; --card2:#1b2330; --ink:#eef2f7; --mut:#8b97a8; --line:#243041;
          --verde:#22c55e; --amarillo:#f5b82e; --rojo:#ff5d5d; --ac:#c6ff3d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; padding-bottom:calc(88px + env(safe-area-inset-bottom)); }
  main { max-width:560px; margin:0 auto; padding:14px 14px 0; }
  header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:4px 0 12px; }
  h1 { font-size:20px; margin:0; }
  .sub { color:var(--mut); font-size:13px; margin-top:2px; }
  .icon-btn { background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:9px 11px; font-size:17px; cursor:pointer; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:12px; }
  .card h2 { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); margin:0 0 10px; font-weight:600; }
  .estado { display:flex; gap:14px; align-items:center; border-width:2px; }
  .estado.verde { border-color:var(--verde); background:linear-gradient(135deg,#0f2a1c,#141a22 70%); }
  .estado.amarillo { border-color:var(--amarillo); background:linear-gradient(135deg,#2e2510,#141a22 70%); }
  .estado.rojo { border-color:var(--rojo); background:linear-gradient(135deg,#341618,#141a22 70%); }
  .luz { width:62px; height:62px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:30px; background:var(--card2); }
  .verde .luz { background:var(--verde); } .amarillo .luz { background:var(--amarillo); } .rojo .luz { background:var(--rojo); }
  .estado b { font-size:19px; display:block; }
  .estado span { color:var(--mut); font-size:14px; }
  .hoy { text-align:center; }
  .hoy .num { font-size:46px; font-weight:800; letter-spacing:-.02em; line-height:1.1; }
  .hoy .lab { color:var(--mut); font-size:14px; }
  .mini { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .mini div { background:var(--card2); border-radius:12px; padding:9px 6px; text-align:center; }
  .mini b { display:block; font-size:16px; } .mini span { color:var(--mut); font-size:12px; }
  .track { position:relative; height:16px; background:var(--card2); border-radius:9px; overflow:hidden; margin:6px 0; }
  .track .win { position:absolute; top:0; bottom:0; background:repeating-linear-gradient(45deg,#c6ff3d33,#c6ff3d33 4px,transparent 4px,transparent 8px); border-left:2px solid var(--ac); }
  .track .fill { position:absolute; top:0; bottom:0; left:0; background:var(--ac); opacity:.85; }
  .track .gasto { position:absolute; top:0; bottom:0; left:0; }
  .track .hoy-m { position:absolute; top:-2px; bottom:-2px; width:3px; background:#fff; }
  .leyenda { display:flex; justify-content:space-between; color:var(--mut); font-size:12px; }
  .donut-wrap { display:flex; gap:14px; align-items:center; }
  .donut { width:112px; height:112px; flex:none; transform:rotate(-90deg); }
  .cats { flex:1; display:grid; gap:6px; font-size:14px; min-width:0; }
  .cats div { display:flex; gap:8px; align-items:center; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .cats .n { margin-left:auto; color:var(--mut); white-space:nowrap; font-size:13px; }
  .cats div > span:nth-child(2) { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .consejo { padding:10px 12px; background:var(--card2); border-radius:12px; margin-top:8px; font-size:15px; }
  .mov { display:flex; gap:12px; align-items:center; padding:11px 0; border-top:1px solid var(--line); cursor:pointer; }
  .mov:first-of-type { border-top:0; }
  .ico { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-size:20px; background:var(--card2); flex:none; }
  .mov .t { flex:1; min-width:0; } .mov .t b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mov .t span { color:var(--mut); font-size:12px; }
  .mov .m { font-weight:700; } .mov .m.rech { color:var(--rojo); } .mov .m.ing { color:var(--verde); }
  .chip { display:inline-block; padding:1px 7px; border-radius:20px; background:var(--card2); font-size:11px; margin-left:4px; }
  .banner { background:#12301f; border:1px solid var(--verde); }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { flex:1; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:9px 4px; cursor:pointer; font-size:14px; color:var(--mut); }
  .tabs button.on { background:var(--ac); color:#10140a; border-color:var(--ac); font-weight:700; }
  .bolsa { padding:9px 0; border-top:1px solid var(--line); cursor:pointer; }
  .bolsa:first-of-type { border-top:0; }
  .bolsa .r { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .bolsa b { font-weight:600; } .bolsa .m { font-weight:700; }
  .bolsa .s { color:var(--mut); font-size:12px; }
  .neg { color:var(--rojo); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#0b0f14ee; backdrop-filter:blur(8px); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); z-index:5; }
  .bar form { max-width:560px; margin:0 auto; display:flex; gap:8px; }
  input,select,button { font:inherit; color:inherit; }
  input,select { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px; width:100%; min-width:0; }
  button.p { background:var(--ac); color:#10140a; border:0; border-radius:12px; padding:0 18px; font-weight:700; cursor:pointer; white-space:nowrap; }
  button.s { background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; }
  button.btn { padding:13px 16px; }
  button:disabled { opacity:.5; }
  .sheet { position:fixed; inset:0; background:#000a; z-index:10; display:flex; align-items:flex-end; }
  .sheet > div { background:var(--card); width:100%; max-width:560px; margin:0 auto; border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:90vh; overflow:auto; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
  .grid button { background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:11px 4px; cursor:pointer; font-size:14px; }
  label { display:block; color:var(--mut); font-size:13px; margin:12px 0 4px; }
  .row { display:flex; gap:8px; margin-top:12px; } .row > * { flex:1; }
  .msg { margin:10px 0; font-size:14px; } .bad { color:var(--rojo); } .ok { color:var(--verde); } .mut { color:var(--mut); }
  .menu { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .item { display:flex; gap:10px; align-items:center; padding:11px 0; border-top:1px solid var(--line); cursor:pointer; }
  .item:first-of-type { border-top:0; }
  .item .t { flex:1; min-width:0; } .item .t b { display:block; font-weight:600; }
  .item .t span { color:var(--mut); font-size:12px; }
  .d-line { display:flex; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .d-line .c { flex:1; min-width:0; } .d-line select { width:auto; padding:7px; font-size:13px; }
  .paso { color:var(--mut); font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  [hidden] { display:none !important; }

  /* ===== Diseño v2: más limpio y con color ===== */
  :root { --bg:#0a0d1a; --card:#131830; --card2:#1c2342; --ink:#f3f5ff; --mut:#98a2c8; --line:#262e55;
          --verde:#34d399; --amarillo:#fbbf24; --rojo:#fb7185; --ac:#7c5cff; --ac2:#22d3ee; --ink-ac:#fff; }
  body { background:radial-gradient(900px 500px at 85% -10%,#2a1f6b55,transparent 60%),radial-gradient(700px 400px at -10% 10%,#0e4a6a44,transparent 60%),var(--bg); background-attachment:fixed; letter-spacing:.005em; }
  h1 { font-size:22px; font-weight:800; letter-spacing:-.02em; }
  .icon-btn { background:#ffffff0d; border:1px solid #ffffff1a; backdrop-filter:blur(6px); border-radius:14px; }
  .card { background:linear-gradient(160deg,#171d3a,#10152b); border:1px solid #ffffff12; border-radius:24px; padding:18px; box-shadow:0 10px 30px #00000040; margin-top:14px; }
  .card h2 { font-size:12px; letter-spacing:.1em; color:var(--mut); }
  .estado { border-width:1px; }
  .estado.verde { border-color:#34d39955; background:linear-gradient(135deg,#0d3a30,#10152b 75%); }
  .estado.amarillo { border-color:#fbbf2455; background:linear-gradient(135deg,#40320c,#10152b 75%); }
  .estado.rojo { border-color:#fb718555; background:linear-gradient(135deg,#481522,#10152b 75%); }
  .luz { box-shadow:0 0 0 6px #ffffff10; }
  .hoy { background:linear-gradient(135deg,#4a2fd1,#1fb6d6); border:0; color:#fff; padding:24px 18px; }
  .hoy .num { font-size:56px; font-weight:800; }
  .hoy .lab { color:#ffffffcc; }
  .hoy .mini div { background:#ffffff22; backdrop-filter:blur(6px); border-radius:16px; }
  .hoy .mini span { color:#ffffffcc; }
  .mini div { background:#ffffff0d; border-radius:16px; }
  .consejo { background:#ffffff0a; border:1px solid #ffffff10; border-radius:16px; }
  .track { background:#ffffff12; } .track .fill { background:linear-gradient(90deg,var(--ac),var(--ac2)); opacity:1; border-radius:9px; }
  .track .win { background:repeating-linear-gradient(45deg,#7c5cff55,#7c5cff55 4px,transparent 4px,transparent 8px); border-left-color:var(--ac2); }
  .tabs button { background:#ffffff0d; border-color:#ffffff14; border-radius:14px; }
  .tabs button.on { background:linear-gradient(135deg,var(--ac),var(--ac2)); color:#fff; border-color:transparent; }
  button.p { background:linear-gradient(135deg,var(--ac),var(--ac2)); color:#fff; border-radius:14px; }
  button.s { background:#ffffff0d; border-color:#ffffff14; border-radius:14px; }
  input,select { background:#ffffff0a; border-color:#ffffff1a; border-radius:14px; }
  .bar { background:#0a0d1ad9; border-top:1px solid #ffffff12; }
  .ico { border-radius:14px; background:#ffffff0d; }
  .banner { background:linear-gradient(135deg,#0d3a30,#10152b); border-color:#34d39966; }
  .sheet > div { background:#131830; border-radius:26px 26px 0 0; border-top:1px solid #ffffff1a; }
  .ing-row { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:12px 0; border-top:1px solid #ffffff10; cursor:pointer; }
  .ing-row:first-of-type { border-top:0; }
  .ing-row .ic { width:40px; height:40px; border-radius:14px; display:grid; place-items:center; background:#34d39922; font-size:20px; flex:none; }
  .ing-row .t { flex:1; min-width:0; } .ing-row .t b { display:block; font-weight:600; } .ing-row .t span { color:var(--mut); font-size:12px; }
  .ing-row .m { font-weight:800; color:var(--verde); white-space:nowrap; }
</style>
</head>
<body>
<main>
  <section id="setup" class="card" hidden>
    <h2>Conectar esta app</h2>
    <div class="sub">Tus datos viven en tu propia cuenta de Google. Aquí solo conectas la app con tu servidor privado.</div>
    <label for="url">Dirección de tu servidor (termina en /exec)</label>
    <input id="url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="code">Tu código de acceso (el que pusiste como APP_TOKEN)</label>
    <input id="code" type="password" autocomplete="off">
    <div id="setupMsg" class="msg bad"></div>
    <div class="row"><button class="p btn" id="saveCode">Guardar</button></div>
  </section>

  <section id="app" hidden>
    <header>
      <div><h1>💸 Mis finanzas</h1><div class="sub" id="ciclo">Cargando…</div></div>
      <div style="display:flex;gap:6px">
        <button class="icon-btn" id="btnScan" title="Revisar correos">🔄</button>
        <button class="icon-btn" id="btnBoleta" title="Subir boleta">📄</button>
        <button class="icon-btn" id="btnCfg" title="Ajustes">⚙️</button>
      </div>
    </header>
    <div id="msg" class="msg" role="status"></div>
    <div id="banner"></div>
    <div id="estado"></div>
    <div id="hoy"></div>
    <div id="ing"></div>
    <div id="presu"></div>
    <div id="linea"></div>
    <div id="donut"></div>
    <div id="consejos"></div>
    <div id="fin"></div>
    <div class="card"><h2>Movimientos</h2><div id="movs"></div></div>
    <p class="sub" style="text-align:center;margin:16px 0"><a href="#" id="reset" style="color:inherit">Cambiar servidor o código</a></p>
  </section>
</main>

<div class="bar" id="barra" hidden>
  <form id="formAdd">
    <input id="texto" placeholder="Gasto en efectivo: almuerzo 18" autocomplete="off" enterkeyhint="send">
    <button class="p" id="btnAdd">Agregar</button>
  </form>
</div>

<div class="sheet" id="sheetMov" hidden><div>
  <b id="smTitulo"></b><div class="sub" id="smInfo"></div>
  <div class="grid" id="smCats"></div>
  <label style="display:flex;gap:8px;align-items:center;margin:0 0 12px"><input type="checkbox" id="smAprender" style="width:auto"> Recordar esta categoría para este comercio</label>
  <div class="row"><button class="s" id="smBorrar">🗑 Borrar</button><button class="s" id="smCerrar">Cerrar</button></div>
</div></div>

<div class="sheet" id="sheetForm" hidden><div id="formBox"></div></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
